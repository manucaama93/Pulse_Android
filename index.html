<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Calculadora Android</title>

    <!-- Configuración para Android PWA / Standalone -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <!-- Configuración para iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculadora">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #121212;
            --btn-num-bg: #2d2d2d;
            --btn-num-text: #ffffff;
            --btn-op-bg: #4b5563;
            --btn-op-text: #60a5fa;
            --btn-action-bg: #374151;
            --btn-action-text: #f87171;
            --btn-equals-bg: #2563eb;
            --btn-equals-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 100%;
            max-width: 380px;
            height: 680px;
            background-color: var(--bg-color);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 16px;
        }

        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px 10px;
            word-break: break-all;
            overflow: hidden;
            width: 100%;
        }

        .expression-line {
            color: #9ca3af;
            font-size: 1.2rem;
            min-height: 1.5rem;
            margin-bottom: 8px;
            text-align: right;
            width: 100%;
        }

        .main-line-wrapper {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            text-align: right;
            scrollbar-width: none;
        }

        .main-line-wrapper::-webkit-scrollbar {
            display: none;
        }

        .main-line {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.2;
            display: inline-block;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 8px;
        }

        button {
            border: none;
            outline: none;
            height: 68px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.1s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active, button.is-pressed {
            transform: scale(0.95);
            filter: brightness(1.3);
        }

        .btn-number {
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
        }

        .btn-operator {
            background-color: var(--btn-action-bg);
            color: var(--btn-op-text);
        }

        .btn-action {
            background-color: var(--btn-action-bg);
            color: var(--btn-action-text);
        }

        .btn-equals {
            background-color: var(--btn-equals-bg);
            color: var(--btn-equals-text);
            border-radius: 24px;
        }

        .btn svg {
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div class="expression-line" id="expressionLine"></div>
        <div class="main-line-wrapper" id="mainWrapper">
            <div class="main-line" id="mainLine">0</div>
        </div>
    </div>
    <div class="keypad" id="keypad">
        <button class="btn btn-action" data-action="backspace">
            <svg width="28" height="28" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
        <button class="btn btn-action" id="clearBtn" data-action="ac">AC</button>
        <button class="btn btn-operator" data-action="operator" data-val="%">%</button>
        <button class="btn btn-operator" data-action="operator" data-val="÷">÷</button>

        <button class="btn btn-number" data-action="digit" data-val="7">7</button>
        <button class="btn btn-number" data-action="digit" data-val="8">8</button>
        <button class="btn btn-number" data-action="digit" data-val="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-val="×">×</button>

        <button class="btn btn-number" data-action="digit" data-val="4">4</button>
        <button class="btn btn-number" data-action="digit" data-val="5">5</button>
        <button class="btn btn-number" data-action="digit" data-val="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-val="-">−</button>

        <button class="btn btn-number" data-action="digit" data-val="1">1</button>
        <button class="btn btn-number" data-action="digit" data-val="2">2</button>
        <button class="btn btn-number" data-action="digit" data-val="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-val="+">+</button>

        <button class="btn btn-number" data-action="toggleSign">±</button>
        <button class="btn btn-number" data-action="digit" data-val="0">0</button>
        <button class="btn btn-number" data-action="decimal">,</button>
        <button class="btn btn-equals" data-action="equal">=</button>
    </div>
</div>

<script>
    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        });
    }

    const mainLineEl = document.getElementById('mainLine');
    const mainWrapperEl = document.getElementById('mainWrapper');
    const expressionLineEl = document.getElementById('expressionLine');
    const clearBtnEl = document.getElementById('clearBtn');
    const keypadEl = document.getElementById('keypad');

    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let waitingForSecondOperand = false;

    let stage = 0; 
    let currentX = 0;
    let targetResult = 0;
    let forcedAddendStr = '';
    let forcedIndex = 0;

    function formatNumber(valStr) {
        if (!valStr || valStr === 'Error') return valStr;
        const parts = valStr.split(',');
        let integerPart = parts[0];
        const decimalPart = parts.length > 1 ? ',' + parts[1] : '';

        const isNegative = integerPart.startsWith('-');
        if (isNegative) integerPart = integerPart.substring(1);

        const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return (isNegative ? '-' : '') + formattedInteger + decimalPart;
    }

    function scrollToRight() {
        setTimeout(() => {
            mainWrapperEl.scrollLeft = mainWrapperEl.scrollWidth;
        }, 0);
    }

    function updateDisplay() {
        if (stage === 4) {
            const currentTypedAddend = forcedAddendStr.substring(0, forcedIndex);
            const formattedBase = formatNumber(String(currentX));
            const formattedAddend = currentTypedAddend ? formatNumber(currentTypedAddend) : '';
            
            mainLineEl.innerText = `${formattedBase}+${formattedAddend}`;
            scrollToRight();
        } else if (operator) {
            const formattedBase = formatNumber(previousValue);
            const formattedSecond = !waitingForSecondOperand ? formatNumber(currentValue) : '';

            mainLineEl.innerText = `${formattedBase}${operator}${formattedSecond}`;
            scrollToRight();
        } else {
            const formatted = formatNumber(currentValue);
            mainLineEl.innerText = formatted;
        }

        clearBtnEl.innerText = (currentValue !== '0' || previousValue !== null || stage === 4) ? 'C' : 'AC';
    }

    function getFutureTargetNumber() {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 2);

        const day = String(now.getDate());
        const month = String(now.getMonth() + 1);
        const year = String(now.getFullYear());
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        return parseInt(`${day}${month}${year}${hours}${minutes}`, 10);
    }

    function handleDigitPress(digit) {
        if (stage === 4) {
            if (forcedIndex < forcedAddendStr.length) {
                forcedIndex++;
                updateDisplay();
            }
            return;
        }

        if (waitingForSecondOperand) {
            currentValue = digit;
            waitingForSecondOperand = false;
        } else {
            currentValue = currentValue === '0' ? digit : currentValue + digit;
        }
        updateDisplay();
    }

    function inputOperator(op) {
        if (op === '+' && stage === 0) {
            stage = 1;
        } else if (op === '+' && stage === 3) {
            stage = 4;
            targetResult = getFutureTargetNumber();
            const addendY = targetResult - currentX;
            forcedAddendStr = String(addendY);
            forcedIndex = 0;
            operator = '+';
            previousValue = String(currentX);
            waitingForSecondOperand = false;
            expressionLineEl.innerText = '';
            updateDisplay();
            return;
        }

        operator = op;
        previousValue = currentValue;
        waitingForSecondOperand = true;
        expressionLineEl.innerText = '';
        updateDisplay();
    }

    function handleEqual() {
        if (stage === 4) {
            expressionLineEl.innerText = `${formatNumber(String(currentX))}+${formatNumber(forcedAddendStr)}`;
            currentValue = String(targetResult);
            stage = 0;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === '+' && stage === 1) {
            const num1 = parseFloat(previousValue.replace(',', '.'));
            const num2 = parseFloat(currentValue.replace(',', '.'));
            const sum = num1 + num2;

            expressionLineEl.innerText = `${formatNumber(previousValue)}+${formatNumber(currentValue)}`;
            currentValue = String(sum).replace('.', ',');
            stage = 2;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === '×' && stage === 2) {
            const num1 = parseFloat(previousValue.replace(',', '.'));
            const num2 = parseFloat(currentValue.replace(',', '.'));
            currentX = Math.round(num1 * num2);

            expressionLineEl.innerText = `${formatNumber(previousValue)}×${formatNumber(currentValue)}`;
            currentValue = String(currentX).replace('.', ',');
            stage = 3;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === null || previousValue === null) return;
        const num1 = parseFloat(previousValue.replace(',', '.'));
        const num2 = parseFloat(currentValue.replace(',', '.'));
        let result = 0;

        switch (operator) {
            case '+': result = num1 + num2; break;
            case '-': result = num1 - num2; break;
            case '×': result = num1 * num2; break;
            case '÷': result = num2 !== 0 ? num1 / num2 : 'Error'; break;
        }

        expressionLineEl.innerText = `${formatNumber(previousValue)}${operator}${formatNumber(currentValue)}`;
        currentValue = String(result).replace('.', ',');
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
    }

    function handleAC() {
        currentValue = '0';
        previousValue = null;
        operator = null;
        waitingForSecondOperand = false;
        stage = 0;
        currentX = 0;
        targetResult = 0;
        forcedAddendStr = '';
        forcedIndex = 0;
        expressionLineEl.innerText = '';
        updateDisplay();
    }

    function handleBackspace() {
        if (waitingForSecondOperand || stage === 4) return;
        if (currentValue.length > 1) {
            currentValue = currentValue.slice(0, -1);
        } else {
            currentValue = '0';
        }
        updateDisplay();
    }

    function toggleSign() {
        if (currentValue === '0' || stage === 4) return;
        currentValue = currentValue.startsWith('-') ? currentValue.substring(1) : '-' + currentValue;
        updateDisplay();
    }

    function inputDecimal() {
        if (stage === 4) return;
        if (waitingForSecondOperand) {
            currentValue = '0,';
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }
        if (!currentValue.includes(',')) {
            currentValue += ',';
            updateDisplay();
        }
    }

    function executeButtonAction(btn) {
        const action = btn.dataset.action;
        const val = btn.dataset.val;

        switch (action) {
            case 'digit':
                handleDigitPress(val);
                break;
            case 'operator':
                inputOperator(val);
                break;
            case 'equal':
                handleEqual();
                break;
            case 'ac':
                handleAC();
                break;
            case 'backspace':
                handleBackspace();
                break;
            case 'toggleSign':
                toggleSign();
                break;
            case 'decimal':
                inputDecimal();
                break;
        }
    }

    function handlePressStart(e) {
        const btn = e.target.closest('.btn');
        if (!btn) return;

        e.preventDefault();
        btn.classList.add('is-pressed');
        executeButtonAction(btn);
    }

    function handlePressEnd(e) {
        const btn = e.target.closest('.btn');
        if (btn) {
            setTimeout(() => {
                btn.classList.remove('is-pressed');
            }, 80);
        } else {
            document.querySelectorAll('.btn.is-pressed').forEach(b => b.classList.remove('is-pressed'));
        }
    }

    keypadEl.addEventListener('touchstart', handlePressStart, { passive: false });
    keypadEl.addEventListener('touchend', handlePressEnd, { passive: false });
    keypadEl.addEventListener('touchcancel', handlePressEnd, { passive: false });

    keypadEl.addEventListener('mousedown', (e) => {
        if ('ontouchstart' in window) return;
        handlePressStart(e);
    });
    keypadEl.addEventListener('mouseup', (e) => {
        if ('ontouchstart' in window) return;
        handlePressEnd(e);
    });
</script>
</body>
</html>
