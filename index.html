<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Android Web</title>
    <style>
        :root {
            --bg-color: #121212;
            --display-color: #121212;
            --btn-num-bg: #2d2d2d;
            --btn-num-text: #ffffff;
            --btn-op-bg: #4b5563;
            --btn-op-text: #60a5fa;
            --btn-action-bg: #374151;
            --btn-action-text: #f87171;
            --btn-equals-bg: #2563eb;
            --btn-equals-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 100%;
            max-width: 360px;
            height: 640px;
            background-color: var(--bg-color);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 16px;
        }

        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px 10px;
            word-break: break-all;
        }

        .history {
            color: #9ca3af;
            font-size: 1.2rem;
            min-height: 1.5rem;
            margin-bottom: 8px;
        }

        .current {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.2;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 8px;
        }

        button {
            border: none;
            outline: none;
            height: 68px;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: scale(0.95);
            filter: brightness(1.3);
        }

        .btn-number {
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
        }

        .btn-operator {
            background-color: var(--btn-action-bg);
            color: var(--btn-op-text);
        }

        .btn-action {
            background-color: var(--btn-action-bg);
            color: var(--btn-action-text);
        }

        .btn-equals {
            background-color: var(--btn-equals-bg);
            color: var(--btn-equals-text);
            border-radius: 24px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div class="history" id="history"></div>
        <div class="current" id="display">0</div>
    </div>
    <div class="keypad">
        <button class="btn-action" onclick="clearAll()">AC</button>
        <button class="btn-action" onclick="deleteLast()">⌫</button>
        <button class="btn-operator" onclick="appendOperator('%')">%</button>
        <button class="btn-operator" onclick="appendOperator('÷')">÷</button>

        <button class="btn-number" onclick="appendNumber('7')">7</button>
        <button class="btn-number" onclick="appendNumber('8')">8</button>
        <button class="btn-number" onclick="appendNumber('9')">9</button>
        <button class="btn-operator" onclick="appendOperator('×')">×</button>

        <button class="btn-number" onclick="appendNumber('4')">4</button>
        <button class="btn-number" onclick="appendNumber('5')">5</button>
        <button class="btn-number" onclick="appendNumber('6')">6</button>
        <button class="btn-operator" onclick="appendOperator('-')">-</button>

        <button class="btn-number" onclick="appendNumber('1')">1</button>
        <button class="btn-number" onclick="appendNumber('2')">2</button>
        <button class="btn-number" onclick="appendNumber('3')">3</button>
        <button class="btn-operator" onclick="appendOperator('+')">+</button>

        <button class="btn-number" onclick="toggleSign()">±</button>
        <button class="btn-number" onclick="appendNumber('0')">0</button>
        <button class="btn-number" onclick="appendPoint('.')">.</button>
        <button class="btn-equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const history = document.getElementById('history');

    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let shouldResetDisplay = false;

    function updateDisplay() {
        display.innerText = currentInput;
        if (operation !== null) {
            history.innerText = `${previousInput} ${operation}`;
        } else {
            history.innerText = '';
        }
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
        updateDisplay();
    }

    function appendPoint() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
        } else if (!currentInput.includes('.')) {
            currentInput += '.';
        }
        updateDisplay();
    }

    function appendOperator(op) {
        if (operation !== null && !shouldResetDisplay) {
            calculate();
        }
        previousInput = currentInput;
        operation = op;
        shouldResetDisplay = true;
        updateDisplay();
    }

    function clearAll() {
        currentInput = '0';
        previousInput = '';
        operation = null;
        shouldResetDisplay = false;
        updateDisplay();
    }

    function deleteLast() {
        if (shouldResetDisplay) return;
        if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
            currentInput = '0';
        } else {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    function toggleSign() {
        if (currentInput === '0') return;
        if (currentInput.startsWith('-')) {
            currentInput = currentInput.slice(1);
        } else {
            currentInput = '-' + currentInput;
        }
        updateDisplay();
    }

    function calculate() {
        if (operation === null || shouldResetDisplay) return;

        let prev = parseFloat(previousInput);
        let curr = parseFloat(currentInput);
        let result = 0;

        switch (operation) {
            case '+':
                result = prev + curr;
                break;
            case '-':
                result = prev - curr;
                break;
            case '×':
                result = prev * curr;
                break;
            case '÷':
                if (curr === 0) {
                    alert("No se puede dividir por cero");
                    clearAll();
                    return;
                }
                result = prev / curr;
                break;
            case '%':
                result = prev % curr;
                break;
            default:
                return;
        }

        history.innerText = `${previousInput} ${operation} ${currentInput} =`;
        currentInput = Number(result.toFixed(8)).toString(); // Evita errores flotantes
        operation = null;
        shouldResetDisplay = true;
        display.innerText = currentInput;
    }
</script>

</body>
</html>
