<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculadora</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F7F8FC">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #F7F8FC;
            --display-text: #191C1E;
            --btn-num-bg: #E8ECF4;
            --btn-num-text: #191C1E;
            --btn-op-bg: #D3E3FD;
            --btn-op-text: #041E49;
            --btn-ac-bg: #A8C7FA;
            --btn-ac-text: #041E49;
            --btn-equals-bg: #63537A;
            --btn-equals-text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Roboto', -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 12px 16px 24px 16px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px;
            color: #444746;
        }

        .header-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #444746;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px 8px 20px 8px;
            word-break: break-all;
            width: 100%;
        }

        .expression-line {
            color: #444746;
            font-size: 1.4rem;
            min-height: 2rem;
            margin-bottom: 8px;
            text-align: right;
            width: 100%;
        }

        .main-line-wrapper {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            text-align: right;
            scrollbar-width: none;
        }

        .main-line-wrapper::-webkit-scrollbar {
            display: none;
        }

        .main-line {
            color: var(--display-text);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.2;
            display: inline-block;
        }

        .expand-bar {
            display: flex;
            justify-content: flex-start;
            padding: 0 8px 12px 8px;
            color: #444746;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        button.btn {
            border: none;
            outline: none;
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 400;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.05s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.btn:active, button.btn.is-pressed {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        .btn-number {
            background-color: var(--btn-num-bg);
            color: var(--btn-num-text);
        }

        .btn-operator {
            background-color: var(--btn-op-bg);
            color: var(--btn-op-text);
        }

        .btn-ac {
            background-color: var(--btn-ac-bg);
            color: var(--btn-ac-text);
        }

        .btn-equals {
            background-color: var(--btn-equals-bg);
            color: var(--btn-equals-text);
        }

        .btn svg {
            fill: currentColor;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header-actions">
    <button class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.42l-1.42 1.42A8.91 8.91 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </button>
    <button class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
</div>

<div class="display">
    <div class="expression-line" id="expressionLine"></div>
    <div class="main-line-wrapper" id="mainWrapper">
        <div class="main-line" id="mainLine">0</div>
    </div>
</div>

<div class="expand-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#444746"><path d="M12 5.83L15.17 9l1.41-1.41L12 2 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 22l4.59-5.59L15.17 15 12 18.17z"/></svg>
</div>

<div class="keypad" id="keypad">
    <!-- Fila 1 -->
    <button class="btn btn-ac" id="clearBtn" data-action="ac">AC</button>
    <button class="btn btn-operator" data-action="parens">( )</button>
    <button class="btn btn-operator" data-action="operator" data-val="%">%</button>
    <button class="btn btn-operator" data-action="operator" data-val="÷">÷</button>

    <!-- Fila 2 -->
    <button class="btn btn-number" data-action="digit" data-val="7">7</button>
    <button class="btn btn-number" data-action="digit" data-val="8">8</button>
    <button class="btn btn-number" data-action="digit" data-val="9">9</button>
    <button class="btn btn-operator" data-action="operator" data-val="×">×</button>

    <!-- Fila 3 -->
    <button class="btn btn-number" data-action="digit" data-val="4">4</button>
    <button class="btn btn-number" data-action="digit" data-val="5">5</button>
    <button class="btn btn-number" data-action="digit" data-val="6">6</button>
    <button class="btn btn-operator" data-action="operator" data-val="-">−</button>

    <!-- Fila 4 -->
    <button class="btn btn-number" data-action="digit" data-val="1">1</button>
    <button class="btn btn-number" data-action="digit" data-val="2">2</button>
    <button class="btn btn-number" data-action="digit" data-val="3">3</button>
    <button class="btn btn-operator" data-action="operator" data-val="+">+</button>

    <!-- Fila 5 -->
    <button class="btn btn-number" data-action="digit" data-val="0">0</button>
    <button class="btn btn-number" data-action="decimal">.</button>
    <button class="btn btn-number" data-action="backspace">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.67-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>
    </button>
    <button class="btn btn-equals" data-action="equal">=</button>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(reg => console.log('SW registrado con éxito:', reg.scope))
                .catch(err => console.log('Error al registrar el SW:', err));
        });
    }

    const mainLineEl = document.getElementById('mainLine');
    const mainWrapperEl = document.getElementById('mainWrapper');
    const expressionLineEl = document.getElementById('expressionLine');
    const clearBtnEl = document.getElementById('clearBtn');
    const keypadEl = document.getElementById('keypad');

    let currentValue = '0';
    let previousValue = null;
    let operator = null;
    let waitingForSecondOperand = false;

    let stage = 0; 
    let currentX = 0;
    let targetResult = 0;
    let forcedAddendStr = '';
    let forcedIndex = 0;

    function formatNumber(valStr) {
        if (!valStr || valStr === 'Error') return valStr;
        const parts = valStr.split('.');
        let integerPart = parts[0];
        const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

        const isNegative = integerPart.startsWith('-');
        if (isNegative) integerPart = integerPart.substring(1);

        const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return (isNegative ? '-' : '') + formattedInteger + decimalPart;
    }

    function scrollToRight() {
        setTimeout(() => {
            mainWrapperEl.scrollLeft = mainWrapperEl.scrollWidth;
        }, 0);
    }

    function updateDisplay() {
        if (stage === 4) {
            const currentTypedAddend = forcedAddendStr.substring(0, forcedIndex);
            const formattedBase = formatNumber(String(currentX));
            const formattedAddend = currentTypedAddend ? formatNumber(currentTypedAddend) : '';
            
            mainLineEl.innerText = `${formattedBase}+${formattedAddend}`;
            scrollToRight();
        } else if (operator) {
            const formattedBase = formatNumber(previousValue);
            const formattedSecond = !waitingForSecondOperand ? formatNumber(currentValue) : '';

            mainLineEl.innerText = `${formattedBase}${operator}${formattedSecond}`;
            scrollToRight();
        } else {
            const formatted = formatNumber(currentValue);
            mainLineEl.innerText = formatted;
        }

        clearBtnEl.innerText = (currentValue !== '0' || previousValue !== null || stage === 4) ? 'AC' : 'AC';
    }

    function getFutureTargetNumber() {
        const now = new Date();
        now.setMinutes(now.getMinutes() + 2);

        const day = String(now.getDate());
        const month = String(now.getMonth() + 1);
        const year = String(now.getFullYear());
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        return parseInt(`${day}${month}${year}${hours}${minutes}`, 10);
    }

    function handleDigitPress(digit) {
        if (stage === 4) {
            if (forcedIndex < forcedAddendStr.length) {
                forcedIndex++;
                updateDisplay();
            }
            return;
        }

        if (waitingForSecondOperand) {
            currentValue = digit;
            waitingForSecondOperand = false;
        } else {
            currentValue = currentValue === '0' ? digit : currentValue + digit;
        }
        updateDisplay();
    }

    function inputOperator(op) {
        if (op === '+' && stage === 0) {
            stage = 1;
        } else if (op === '+' && stage === 3) {
            stage = 4;
            targetResult = getFutureTargetNumber();
            const addendY = targetResult - currentX;
            forcedAddendStr = String(addendY);
            forcedIndex = 0;
            operator = '+';
            previousValue = String(currentX);
            waitingForSecondOperand = false;
            expressionLineEl.innerText = '';
            updateDisplay();
            return;
        }

        operator = op;
        previousValue = currentValue;
        waitingForSecondOperand = true;
        expressionLineEl.innerText = '';
        updateDisplay();
    }

    function handleEqual() {
        if (stage === 4) {
            expressionLineEl.innerText = `${formatNumber(String(currentX))}+${formatNumber(forcedAddendStr)}`;
            currentValue = String(targetResult);
            stage = 0;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === '+' && stage === 1) {
            const num1 = parseFloat(previousValue);
            const num2 = parseFloat(currentValue);
            const sum = num1 + num2;

            expressionLineEl.innerText = `${formatNumber(previousValue)}+${formatNumber(currentValue)}`;
            currentValue = String(sum);
            stage = 2;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === '×' && stage === 2) {
            const num1 = parseFloat(previousValue);
            const num2 = parseFloat(currentValue);
            currentX = Math.round(num1 * num2);

            expressionLineEl.innerText = `${formatNumber(previousValue)}×${formatNumber(currentValue)}`;
            currentValue = String(currentX);
            stage = 3;
            operator = null;
            previousValue = null;
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }

        if (operator === null || previousValue === null) return;
        const num1 = parseFloat(previousValue);
        const num2 = parseFloat(currentValue);
        let result = 0;

        switch (operator) {
            case '+': result = num1 + num2; break;
            case '-': result = num1 - num2; break;
            case '×': result = num1 * num2; break;
            case '÷': result = num2 !== 0 ? num1 / num2 : 'Error'; break;
        }

        expressionLineEl.innerText = `${formatNumber(previousValue)}${operator}${formatNumber(currentValue)}`;
        currentValue = String(result);
        operator = null;
        previousValue = null;
        waitingForSecondOperand = false;
        updateDisplay();
    }

    function handleAC() {
        currentValue = '0';
        previousValue = null;
        operator = null;
        waitingForSecondOperand = false;
        stage = 0;
        currentX = 0;
        targetResult = 0;
        forcedAddendStr = '';
        forcedIndex = 0;
        expressionLineEl.innerText = '';
        updateDisplay();
    }

    function handleBackspace() {
        if (waitingForSecondOperand || stage === 4) return;
        if (currentValue.length > 1) {
            currentValue = currentValue.slice(0, -1);
        } else {
            currentValue = '0';
        }
        updateDisplay();
    }

    function inputDecimal() {
        if (stage === 4) return;
        if (waitingForSecondOperand) {
            currentValue = '0.';
            waitingForSecondOperand = false;
            updateDisplay();
            return;
        }
        if (!currentValue.includes('.')) {
            currentValue += '.';
            updateDisplay();
        }
    }

    function executeButtonAction(btn) {
        const action = btn.dataset.action;
        const val = btn.dataset.val;

        switch (action) {
            case 'digit':
                handleDigitPress(val);
                break;
            case 'operator':
                inputOperator(val);
                break;
            case 'equal':
                handleEqual();
                break;
            case 'ac':
                handleAC();
                break;
            case 'backspace':
                handleBackspace();
                break;
            case 'decimal':
                inputDecimal();
                break;
        }
    }

    function handlePressStart(e) {
        const btn = e.target.closest('.btn');
        if (!btn) return;

        e.preventDefault();
        btn.classList.add('is-pressed');
        executeButtonAction(btn);
    }

    function handlePressEnd(e) {
        const btn = e.target.closest('.btn');
        if (btn) {
            setTimeout(() => {
                btn.classList.remove('is-pressed');
            }, 80);
        } else {
            document.querySelectorAll('.btn.is-pressed').forEach(b => b.classList.remove('is-pressed'));
        }
    }

    keypadEl.addEventListener('touchstart', handlePressStart, { passive: false });
    keypadEl.addEventListener('touchend', handlePressEnd, { passive: false });
    keypadEl.addEventListener('touchcancel', handlePressEnd, { passive: false });

    keypadEl.addEventListener('mousedown', (e) => {
        if ('ontouchstart' in window) return;
        handlePressStart(e);
    });
    keypadEl.addEventListener('mouseup', (e) => {
        if ('ontouchstart' in window) return;
        handlePressEnd(e);
    });
</script>
</body>
</html>
